[project]
name = "ecommerce-review-router"
version = "0.1.0"
description = "NLP review analyzer that routes e-commerce complaints to support departments with aspect-level sentiment and priority scoring"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyspark>=4.2.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

# `uv run pytest tests/` used to fail on a clean checkout: pytest was never a
# declared dependency, so it only worked where one happened to be installed
# globally. httpx is required by fastapi.testclient.
[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
