services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: review_router_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./app/models/trained_model:/app/app/models/trained_model
      - sqlite_data:/app/app/db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: review_router_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
