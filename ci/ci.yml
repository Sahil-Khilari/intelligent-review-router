name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # GitHub runners have no GPU. This is the single sanctioned CPU escape and
  # is read only by app/services/device.py; the application never sets it.
  ALLOW_CPU: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - name: Install (CPU torch; no GPU on runners)
        run: uv sync --group dev --index pytorch-cpu=https://download.pytorch.org/whl/cpu
        continue-on-error: true
      - name: Install fallback
        run: uv sync --group dev
      - name: Tests
        run: uv run pytest tests/ -q
